<body>
<div class="box">
    <h1>FocusWave</h1>
    <p>Synthesized audio code blocks. Zero media files required.</p>
    
    <!-- THE CENTERED AD ZONE -->
    <div class="ad-internal-wrapper">
        <div class="ad-title">Sponsored Content</div>
        <script async="async" data-cfasync="false" src="https://bauval.org"></script>
        <div id="container-757337afecbf3235c4d44e057fd4bc3c"></div>
    </div>

    <div id="grid"></div>
    
    <!-- CLEAN STUDENT NETWORK NAVIGATION FOOTER -->
    <div class="footer" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.08); font-size: 0.75rem; font-family: monospace; color: #4e5579; line-height: 1.6; text-align: center;">
        🛠️ Other Tools:<br>
        
        🧾 <a href="" target="_blank" style="color: #82aaff; text-decoration: none; font-weight: bold;">TrueBill Splitter</a>
    </div>
</div>

<script>
    const sounds = [
        { id: 'brown', name: 'Brown Noise', desc: 'Heavy rumble to block chaos' },
        { id: 'pink', name: 'Pink Noise', desc: 'Soothing rain-like static' },
        { id: 'alpha', name: 'Alpha Beats (12Hz)', desc: 'For structural memory recall' },
        { id: 'theta', name: 'Theta Beats (6Hz)', desc: 'Deep creative flow state' },
        { id: 'clock', name: 'Focus Clock', desc: 'Steady mechanical tracking click' },
        { id: 'zen', name: 'Zen Hum', desc: 'Resonant harmonic frequency' }
    ];

    let audioCtx = null;
    const active = {};

    document.getElementById('grid').innerHTML = sounds.map(s => `
        <div class="row" id="row-${s.id}">
            <div class="info"><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div>
            <div class="controls">
                <input type="range" id="vol-${s.id}" min="0" max="1" step="0.05" value="0.3">
                <button class="toggle-btn" onclick="toggle('${s.id}')">▶</button>
            </div>
        </div>
    `).join('');

    function toggle(id) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const row = document.getElementById(`row-${id}`), btn = row.querySelector('.toggle-btn'), slider = document.getElementById(`vol-${id}`);

        if (active[id]) {
            if (active[id].int) clearInterval(active[id].int);
            active[id].gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            setTimeout(() => { try { active[id].src.stop(); } catch(e){} delete active[id]; }, 160);
            row.classList.remove('active'); btn.textContent = '▶';
            return;
        }

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(slider.value, audioCtx.currentTime);
        gainNode.connect(audioCtx.destination);
        let src, interval = null;

        if (id === 'brown' || id === 'pink') {
            const buf = audioCtx.createBuffer(1, 2 * audioCtx.sampleRate, audioCtx.sampleRate), out = buf.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
            for (let i = 0; i < buf.length; i++) {
                let w = Math.random() * 2 - 1;
                if (id === 'brown') { out[i] = (last + (0.02 * w)) / 1.02; last = out[i]; out[i] *= 3.5; }
                else { b0 = 0.99886*b0+w*0.0555; b1 = 0.99332*b1+w*0.075; b2 = 0.969*b2+w*0.153; b3 = 0.8665*b3+w*0.31; b4 = 0.55*b4+w*0.532; b5 = -0.7616*b5-w*0.0168; out[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.536)*0.11; b6 = w*0.1159; }
            }
            src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
        } else if (id === 'alpha' || id === 'theta') {
            const split = audioCtx.createChannelMerger(2), l = audioCtx.createOscillator(), r = audioCtx.createOscillator();
            l.frequency.value = 150; r.frequency.value = 150 + (id === 'alpha' ? 12 : 6);
            l.connect(split, 0, 0); r.connect(split, 0, 1);
            src = { start: () => { l.start(); r.start(); }, stop: () => { l.stop(); r.stop(); }, connect: (d) => split.connect(d) };
        } else {
            src = audioCtx.createOscillator(); src.type = id === 'clock' ? 'triangle' : 'sine'; src.frequency.value = id === 'clock' ? 600 : 168.39;
            if (id === 'clock') {
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                interval = setInterval(() => { gainNode.gain.setValueAtTime(slider.value * 0.2, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04); }, 1000);
            }
        }

        src.connect(gainNode); src.start(0);
        active[id] = { src, gain: gainNode, int: interval };
        row.classList.add('active'); btn.textContent = '◼';
        slider.oninput = (e) => { if (active[id] && id !== 'clock') active[id].gain.gain.setValueAtTime(e.target.value, audioCtx.currentTime); };
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body { background: #0d0f16; color: #eff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 15px; box-sizing: border-box; justify-content: center; }
        .box { width: 100%; max-width: 380px; background: #161925; padding: 20px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1.6rem; color: #82aaff; } p { margin: 0 0 15px; color: #4e5579; font-size: 0.8rem; }
        .pomo { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .pomo-setup { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #4e5579; }
        .pomo-input { background: #0d0f16; border: 1px solid rgba(130,170,255,0.2); color: #ffcb6b; width: 45px; text-align: center; padding: 4px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 0.9rem; }
        .pomo-time { font-size: 1.8rem; font-family: monospace; font-weight: bold; color: #ffcb6b; }
        .pomo-btn { background: #82aaff; border: none; padding: 6px 14px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.8rem; color: #0d0f16; }
        .row { background: rgba(255,255,255,0.01); padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); gap: 10px; }
        .row.active { border-color: #82aaff; background: rgba(130,170,255,0.04); }
        .info { text-align: left; flex: 1; min-width: 0; } 
        .name { font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        .desc { font-size: 0.7rem; color: #4e5579; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .controls { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        input[type="range"] { width: 65px; accent-color: #82aaff; height: 6px; cursor: pointer; }
        .toggle-btn { background: transparent; border: 1px solid #4e5579; color: #4e5579; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
        .row.active .toggle-btn { background: #82aaff; border-color: #82aaff; color: #0d0f16; }
    </style>
</head>
<body>
<div class="box">
    <h1>FocusWave</h1><p>Pure audio synthesis. No media footprint.</p>
    <div class="pomo">
        <div class="pomo-setup" id="setup-wrapper">
            <span>Set Timer:</span><input type="number" class="pomo-input" id="mins-input" min="1" max="180" value="25" oninput="updateMinutes()"><span>mins</span>
        </div>
        <div class="pomo-time" id="timer">25:00</div>
        <button class="pomo-btn" id="tBtn" onclick="runTimer()">Start</button>
    </div>
    <div id="grid"></div>
</div>
<script>
    const sounds = [
        { id: 'white', name: 'White Noise', desc: 'Masks open office chatter' }, { id: 'pink', name: 'Pink Noise', desc: 'Quiets sudden ambient drops' }, { id: 'brown', name: 'Brown Noise', desc: 'Blocks erratic ADHD triggers' },
        { id: 'alpha', name: 'Alpha Beats (12Hz)', desc: 'Boosts deep data retention' }, { id: 'theta', name: 'Theta Beats (6Hz)', desc: 'Induces creative design flow' }, { id: 'gamma', name: 'Gamma Beats (40Hz)', desc: 'Sharpens complex logic & math' },
        { id: 'delta', name: 'Delta Waves (2Hz)', desc: 'Eases study anxiety & burnout' }, { id: 'clock', name: 'Focus Clock', desc: 'Maintains flat task momentum' }, { id: 'zen', name: 'Zen Hum', desc: 'Drowns environmental noise' }, { id: 'space', name: 'Space Drone', desc: 'Calms overstimulated systems' }
    ];
    let audioCtx = null, active = {}, pInt = null, defaultMins = 25, timeLeft = 25 * 60, running = false;

    function updateMinutes() {
        if (running) return;
        let val = parseInt(document.getElementById('mins-input').value) || 25;
        if (val < 1) val = 1; defaultMins = val; timeLeft = val * 60;
        document.getElementById('timer').textContent = `${val.toString().padStart(2, '0')}:00`;
    }

    function runTimer() {
        const btn = document.getElementById('tBtn'), disp = document.getElementById('timer'), setup = document.getElementById('setup-wrapper');
        if (running) { clearInterval(pInt); btn.textContent = "Start"; setup.style.visibility = "visible"; running = false; return; }
        running = true; btn.textContent = "Pause"; setup.style.visibility = "hidden";
        pInt = setInterval(() => {
            timeLeft--; disp.textContent = `${Math.floor(timeLeft/60).toString().padStart(2,'0')}:${(timeLeft%60).toString().padStart(2,'0')}`;
            if (timeLeft <= 0) { clearInterval(pInt); disp.textContent = `${defaultMins.toString().padStart(2, '0')}:00`; timeLeft = defaultMins * 60; btn.textContent = "Start"; setup.style.visibility = "visible"; running = false; alert("Time is up!"); }
        }, 1000);
    }

    document.getElementById('grid').innerHTML = sounds.map(s => `
        <div class="row" id="row-${s.id}"><div class="info"><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div>
            <div class="controls"><input type="range" id="vol-${s.id}" min="0" max="1" step="0.05" value="0.3" oninput="setVol('${s.id}', this.value)"><button class="toggle-btn" onclick="toggle('${s.id}')">▶</button></div></div>
    `).join('');

    function setVol(id, val) { if (active[id]) active[id].gain.gain.setValueAtTime(val, audioCtx.currentTime); }

    function toggle(id) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const row = document.getElementById(`row-${id}`), btn = row.querySelector('.toggle-btn'), slider = document.getElementById(`vol-${id}`);
        if (active[id]) {
            if (active[id].int) clearInterval(active[id].int); active[id].gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            setTimeout(() => { try{ active[id].src.stop(); }catch(e){} delete active[id]; }, 120); row.classList.remove('active'); btn.textContent = '▶'; return;
        }
        const gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(slider.value, audioCtx.currentTime); gainNode.connect(audioCtx.destination);
        let src, interval = null;

        if (id === 'white' || id === 'pink' || id === 'brown') {
            const buf = audioCtx.createBuffer(1, 2 * audioCtx.sampleRate, audioCtx.sampleRate), out = buf.getChannelData(0); let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0, last=0;
            for (let i = 0; i < buf.length; i++) {
                let w = Math.random() * 2 - 1;
                if (id === 'white') out[i] = w * 0.5; else if (id === 'brown') { out[i] = (last + (0.02 * w)) / 1.02; last = out[i]; out[i] *= 3.5; }
                else { b0=0.99886*b0+w*0.0555; b1=0.99332*b1+w*0.075; b2=0.969*b2+w*0.153; b3=0.8665*b3+w*0.31; b4=0.55*b4+w*0.532; b5=-0.7616*b5-w*0.0168; out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.536)*0.11; b6=w*0.1159; }
            }
            src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(gainNode); src.start(0);
        } else if (id === 'alpha' || id === 'theta' || id === 'gamma' || id === 'delta') {
            const split = audioCtx.createChannelMerger(2), l = audioCtx.createOscillator(), r = audioCtx.createOscillator();
            let bHz = (id === 'delta') ? 100 : 150, gHz = (id === 'alpha') ? 12 : (id === 'theta') ? 6 : (id === 'gamma') ? 40 : 2;
            l.frequency.setValueAtTime(bHz, audioCtx.currentTime); r.frequency.setValueAtTime(bHz + gHz, audioCtx.currentTime);
            l.connect(split, 0, 0); r.connect(split, 0, 1); split.connect(gainNode); l.start(0); r.start(0); src = { stop: () => { l.stop(); r.stop(); } };
        } else if (id === 'clock') {
            let tick = true;
            interval = setInterval(() => {
                const osc = audioCtx.createOscillator(), cGain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(tick ? 700 : 500, audioCtx.currentTime); tick = !tick;
                cGain.gain.setValueAtTime(slider.value * 0.3, audioCtx.currentTime); cGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(cGain); cGain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            }, 1000); src = { stop: () => {} };
        } else if (id === 'zen' || id === 'space') {
            const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
            o1.frequency.setValueAtTime((id === 'zen') ? 100 : 60, audioCtx.currentTime); o2.frequency.setValueAtTime((id === 'zen') ? 200 : 90, audioCtx.currentTime);
            if(id === 'space') { o1.type = 'sawtooth'; o2.type = 'sine'; } o1.connect(gainNode); o2.connect(gainNode); o1.start(0); o2.start(0); src = { stop: () => { o1.stop(); o2.stop(); } };
        } active[id] = { src, gain: gainNode, int: interval }; row.classList.add('active'); btn.textContent = '◼';
    }
</script>
</body>
</html>

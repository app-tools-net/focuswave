<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusWave | Ambient Soundscapes & Pomodoro</title>
    <meta name="description" content="Stream free synthesized ambient sounds, pink noise, and binaural beats with a built-in Pomodoro timer for deep study.">
    
    <!-- LIVE PRIVACY-FIRST TRAFFIC TRACKING -->
    <script data-goatcounter="https://goatcounter.com" async src="//gc.zgo.at/count.js"></script>
    
    <style>
        body { background: #0d0f16; color: #eff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 15px; box-sizing: border-box; justify-content: center; }
        .box { width: 100%; max-width: 380px; background: #161925; padding: 20px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1.6rem; color: #82aaff; }
        p { margin: 0 0 15px; color: #4e5579; font-size: 0.8rem; }
        .pomo { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        .pomo-time { font-size: 1.8rem; font-family: monospace; font-weight: bold; color: #ffcb6b; }
        .pomo-btn { background: #82aaff; border: none; padding: 6px 14px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-top: 5px; color: #0d0f16; }
        .row { background: rgba(255,255,255,0.01); padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .row.active { border-color: #82aaff; background: rgba(130,170,255,0.04); }
        .info { text-align: left; }
        .name { font-weight: bold; font-size: 0.85rem; }
        .desc { font-size: 0.7rem; color: #4e5579; }
        input { width: 65px; accent-color: #82aaff; }
        .toggle-btn { background: transparent; border: 1px solid #4e5579; color: #4e5579; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
        .row.active .toggle-btn { background: #82aaff; border-color: #82aaff; color: #0d0f16; }
        #private-counter { display: none; margin-top: 15px; font-family: monospace; font-size: 0.7rem; color: #4e5579; border-top: 1px dashed rgba(78,85,121,0.2); padding-top: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h1>FocusWave</h1>
    <p>Pure audio synthesis. No media footprint.</p>
    <div class="pomo">
        <div class="pomo-time" id="timer">25:00</div>
        <button class="pomo-btn" id="tBtn" onclick="runTimer()">Start</button>
    </div>
    <div id="grid"></div>
    <div id="private-counter">📊 Total Site Hits: <span id="view-count">Loading...</span></div>
</div>
<script>
    const sounds = [
        { id: 'brown', name: 'Brown Noise', desc: 'Deep background rumble' },
        { id: 'pink', name: 'Pink Noise', desc: 'Soft rain-like static' },
        { id: 'alpha', name: 'Alpha Beats (12Hz)', desc: 'Focus & cognitive processing' },
        { id: 'theta', name: 'Theta Beats (6Hz)', desc: 'Creative flow states' },
        { id: 'clock', name: 'Focus Clock', desc: 'Mechanical tracking click' },
        { id: 'zen', name: 'Zen Hum', desc: 'Resonant harmonic drone' }
    ];
    let audioCtx = null, active = {}, pInt = null, timeLeft = 25 * 60, running = false;

    function runTimer() {
        const btn = document.getElementById('tBtn'), disp = document.getElementById('timer');
        if (running) { clearInterval(pInt); btn.textContent = "Resume"; running = false; return; }
        running = true; btn.textContent = "Pause";
        pInt = setInterval(() => {
            timeLeft--;
            disp.textContent = `${Math.floor(timeLeft/60).toString().padStart(2,'0')}:${(timeLeft%60).toString().padStart(2,'0')}`;
            if (timeLeft <= 0) { clearInterval(pInt); disp.textContent = "25:00"; timeLeft = 25 * 60; btn.textContent = "Start"; running = false; alert("Cycle done!"); }
        }, 1000);
    }

    document.getElementById('grid').innerHTML = sounds.map(s => `
        <div class="row" id="row-${s.id}">
            <div class="info"><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div>
            <div class="controls">
                <input type="range" id="vol-${s.id}" min="0" max="1" step="0.05" value="0.3" oninput="setVol('${s.id}', this.value)">
                <button class="toggle-btn" onclick="toggle('${s.id}')">▶</button>
            </div>
        </div>
    `).join('');

    function setVol(id, val) { if (active[id]) active[id].gain.gain.setValueAtTime(val, audioCtx.currentTime); }

    function toggle(id) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const row = document.getElementById(`row-${id}`), btn = row.querySelector('.toggle-btn'), slider = document.getElementById(`vol-${id}`);
        
        if (active[id]) {
            if (active[id].int) clearInterval(active[id].int);
            active[id].gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            setTimeout(() => { try{ active[id].src.stop(); }catch(e){} delete active[id]; }, 120);
            row.classList.remove('active'); btn.textContent = '▶'; return;
        }

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(slider.value, audioCtx.currentTime);
        gainNode.connect(audioCtx.destination);
        let src, interval = null;

        if (id === 'brown' || id === 'pink') {
            const buf = audioCtx.createBuffer(1, 2 * audioCtx.sampleRate, audioCtx.sampleRate), out = buf.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0, last=0;
            for (let i = 0; i < buf.length; i++) {
                let w = Math.random() * 2 - 1;
                if (id === 'brown') { out[i] = (last + (0.02 * w)) / 1.02; last = out[i]; out[i] *= 3.5; }
                else { b0=0.99886*b0+w*0.0555; b1=0.99332*b1+w*0.075; b2=0.969*b2+w*0.153; b3=0.8665*b3+w*0.31; b4=0.55*b4+w*0.532; b5=-0.7616*b5-w*0.0168; out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.536)*0.11; b6=w*0.1159; }
            }
            src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(gainNode); src.start(0);
        } else if (id === 'alpha' || id === 'theta') {
            const split = audioCtx.createChannelMerger(2), l = audioCtx.createOscillator(), r = audioCtx.createOscillator();
            l.frequency.setValueAtTime(150, audioCtx.currentTime); r.frequency.setValueAtTime(150 + (id === 'alpha' ? 12 : 6), audioCtx.currentTime);
            l.connect(split, 0, 0); r.connect(split, 0, 1); split.connect(gainNode); l.start(0); r.start(0);
            src = { stop: () => { l.stop(); r.stop(); } };
        } else if (id === 'clock') {
            let tick = true;
            interval = setInterval(() => {
                const osc = audioCtx.createOscillator(), cGain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(tick ? 700 : 500, audioCtx.currentTime); tick = !tick;
                cGain.gain.setValueAtTime(slider.value * 0.3, audioCtx.currentTime); cGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(cGain); cGain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            }, 1000);
            src = { stop: () => {} };
        } else if (id === 'zen') {
            const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
            o1.frequency.setValueAtTime(100, audioCtx.currentTime); o2.frequency.setValueAtTime(200, audioCtx.currentTime);
            o1.connect(gainNode); o2.connect(gainNode); o1.start(0); o2.start(0);
            src = { stop: () => { o1.stop(); o2.stop(); } };
        }
        active[id] = { src, gain: gainNode, int: interval };
        row.classList.add('active'); btn.textContent = '◼';
    }

    if (new URLSearchParams(window.location.search).get('admin') === 'true') {
        document.getElementById('private-counter').style.display = 'block';
        fetch('https://goatcounter.comer/total.json')
            .then(res => res.json()).then(data => { document.getElementById('view-count').textContent = data.count || '0'; })
            .catch(() => { document.getElementById('view-count').textContent = 'Offline'; });
    }
</script>
</body>
</html>
